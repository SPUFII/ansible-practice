---
- name: Configure web server for myapp
  hosts: webservers
  become: true
  gather_facts: true

  vars:
    app_user: appuser
    app_directory: /var/www/myapp
    domain_name: myapp.local

    nginx_config_src: ../templates/myapp.nginx.conf.j2
    nginx_config_dest: "/etc/nginx/sites-available/{{ domain_name }}"
    nginx_config_link: "/etc/nginx/sites-enabled/{{ domain_name }}"

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        update_cache_retries: 3
        update_cache_retry_max_delay: 12
        lock_timeout: 60

    - name: Install web server packages
      ansible.builtin.apt:
        name:
          - nginx
          - ufw
          - python3-pip
        state: present
        lock_timeout: 60

    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: true
        state: present

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Create test index page
      ansible.builtin.copy:
        dest: "{{ app_directory }}/index.html"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
        content: |
          <!doctype html>
          <html lang="ru">
            <head>
              <meta charset="utf-8">
              <title>{{ domain_name }}</title>
            </head>
            <body>
              <h1>Салам тебе от {{ domain_name }}</h1>
              <p>Первый плейбук долетел до сервера.</p>
            </body>
          </html>

    - name: Deploy nginx virtual host config
      ansible.builtin.template:
        src: "{{ nginx_config_src }}"
        dest: "{{ nginx_config_dest }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Enable nginx virtual host
      ansible.builtin.file:
        src: "{{ nginx_config_dest }}"
        dest: "{{ nginx_config_link }}"
        state: link
        force: true
      notify: Reload nginx

    - name: Disable default nginx virtual host
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Allow SSH through UFW
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP through UFW
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Enable UFW with default deny policy
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Ensure nginx is started and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Check nginx local HTTP response
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
      register: nginx_check

    - name: Show nginx response status
      ansible.builtin.debug:
        msg: "Nginx вернул статус {{ nginx_check.status }}"

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
