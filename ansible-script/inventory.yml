---
all:
  children:
    linux_containers:
      hosts:
        linux-container-3:
          ansible_connection: docker
        linux-container-2:
          ansible_connection: docker
        linux-container-1:
          ansible_connection: docker
      vars:
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

    # Группы по назначению (примеры)
    webservers:
      hosts: {}

    databases:
      hosts: {}

    appservers:
      hosts: {}
