---
- name: Install PostgreSQL
  ansible.builtin.apt:
    name:
      - "{{ postgresql_package_name }}"
      - python3-psycopg2
    state: present
    update_cache: true
  when: ansible_facts["os_family"] == "Debian"
- name: Ensure PostgreSQL service is enabled and started
  ansible.builtin.service:
    name: "{{ postgresql_service_name }}"
    state: started
    enabled: true 