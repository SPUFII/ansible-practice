---
- name: Create deplpoy group
  ansible.builtin.group:
    name: "{{ deploy_group }}"
    state: present

- name: Create deploy user 
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    groups: "{{ deploy_user_groups }}"
    append: true
    shell: "{{ deploy_user_shell }}"
    create_home: "{{ deploy_user_create_home }}"
    state: present

- name: Add SSH public key for deploy user 
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ deploy_user_ssh_public_key }}"
    state: present
    manage_dir: true
  when: deploy_user_ssh_public_key | length > 0

- name: Configure passwordless sudo for deploy users
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ deploy_user }}"
    content: "{{ deploy_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"